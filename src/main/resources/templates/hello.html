<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Authentication</title>
    <script>
        // 페이지 로드 시 토큰을 포함한 요청을 보냄
        window.onload = function() {
            // JWT 토큰을 로컬 스토리지나 쿠키에서 가져옵니다.
            // 예시로 로컬 스토리지에서 가져오고 있지만, 실제로는 서버나 다른 곳에서 받아올 수 있습니다.
            const token = localStorage.getItem("jwtToken"); // 로컬 스토리지에서 토큰을 가져옴

            if (!token) {
                alert("No token found!");
                return;
            }

            // GET 요청을 보내고 응답을 받아서 처리합니다.
            fetch("/api/hello", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token,  // 헤더에 JWT 토큰을 포함
                }
            })
            .then(response => response.json())  // JSON 형식의 응답 처리
            .then(data => {
                // 응답에서 username을 가져와서 HTML 요소에 표시
                document.getElementById("username").textContent =  data.username + "입니다 !";
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to fetch data.");
            });
        };
    </script>
</head>
<body>
<h1>JWT 인증 확인 페이지</h1>
<p id="username">당신의 아이디는...</p> <!-- 이곳에 username을 표시합니다. -->
</body>
</html>
