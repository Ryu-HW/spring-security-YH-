<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

    <!--    csrf활성화시 html head태그에 추가해야함 없어도 잘 되긴함-->
    <!--    <meta name="_csrf" content="{{_csrf.token}}"/>-->
    <!--    <meta name="_csrf_header" content="{{_csrf.headerName}}"/>-->
</head>
<body>
로그인 페이지
<hr>
<form id="login-form">
    <input id="username" type="email" name="username" placeholder="id"/>
    <input id="password" type="password" name="password" placeholder="password"/>
    <!--    <input type="hidden" id="csrf-token" name="_csrf" value="${_csrf.token}"/>-->
    <input type="submit" value="login"/>
</form>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>


    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();  // 기본 폼 제출 동작을 방지합니다.

        // 입력값을 가져옵니다.
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // JSON 데이터로 변환
        const loginData = {
            username: username,
            password: password,
        };

        // axios를 사용하여 POST 요청 보내기
        axios.post('/login', loginData)
        .then(function(response) {
            // 응답에서 토큰을 받았다고 가정
            const token = response.data.token;

            if (token) {
                // JWT 토큰을 localStorage에 저장
                localStorage.setItem('jwtToken', token);
                alert('로그인 성공');
                console.log('로그인 성공:', response.data);

                // 로그인 성공 후 추가 동작을 여기에서 처리
                window.location.href = "/";  // 로그인 성공 후 이동할 페이지
            } else {
                alert('토큰이 없습니다. 로그인 실패!');
            }
        })
        .catch(function(error) {
            console.error('로그인 오류:', error);
            // 로그인 실패 후 처리 (예: 에러 메시지 출력)
            alert("로그인 실패");
            window.location.href = "/login";  // 로그인 실패 시 로그인 페이지로 리다이렉션
        });
    });


</script>

</body>
</html>
