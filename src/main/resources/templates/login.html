<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
</head>
<body>

<h2>로그인</h2>
<form id="login-form">
    <input type="email" id="username" name="username" placeholder="아이디" required>
    <input type="password" id="password" name="password" placeholder="비밀번호" required>
    <input type="submit" value="로그인">
</form>

<script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
        event.preventDefault();  // 폼 제출의 기본 동작을 막음

        // 폼 데이터 가져오기
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // 서버에 보낼 데이터
        const loginData = {
            username: username,
            password: password
        };

        // POST 요청을 서버로 보내기 (fetch 사용)
        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'  // 요청 데이터 형식
            },
            body: JSON.stringify(loginData)  // 데이터 바디에 JSON 형식으로 보냄
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('로그인 실패');
            }
            return response.json();  // 응답을 JSON으로 파싱
        })
        .then(data => {
            // 로그인 성공 후
            console.log('로그인 성공:', data);

            // 서버에서 JWT 토큰을 쿠키에 저장함
            alert('로그인 성공!');
            window.location.href = "/";  // 로그인 후 이동할 페이지
        })
        .catch(error => {
            // 요청이 실패하면
            console.error('로그인 오류:', error);
            alert('로그인 실패!');
        });
    });
</script>

</body>
</html>
