<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request Example</title>
    <!-- 부트스트랩 최신 버전 CSS 링크 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">쿠키 JWT 실험 !</h1>
    <div class="card p-4 mt-4">
        <h2 class="card-title text-center mb-4">로그인 아이디 받아오기</h2>
        <div class="text-center">
            <button id="fetchUsernameBtn" class="btn btn-primary btn-lg">아이디 보여주기</button>
        </div>
        <div id="usernameDisplay" class="alert alert-info mt-3" style="display: none;">
            <strong>아이디 :</strong> <span id="usernameText"></span>
        </div>
    </div>
</div>

<!-- 부트스트랩 JS와 Popper.js 링크 -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0v8FqzKxXt7I5Kh0V9HTpm6pIXsVxxToFlp/3I52CxJr1UJS" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-7JXLMW0gddOd8h2PDoVrN4zR+4ip0kByx3tLjsMeW12EKqK0YQmIrcg7arNzR9gS" crossorigin="anonymous"></script>

<script>
    // 페이지가 로드되면 자동으로 GET /hello API 호출
    window.onload = function() {
        fetchUsername();
    };

    // 버튼을 눌렀을 때 username을 요청하는 함수
    document.getElementById('fetchUsernameBtn').addEventListener('click', function() {
        fetchUsername();
    });

    // GET /hello API를 호출하는 함수
    function fetchUsername() {
        fetch('/hello')  // /hello API에 GET 요청
            .then(response => {

                // 403 에러가 발생한 경우
                if (response.status === 403) {
                console.log('403 error');
                document.getElementById('usernameText').textContent = "로그인이 필요합니다.";
                document.getElementById('usernameDisplay').style.display = 'block';
                }

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();  // 응답을 JSON으로 파싱
            })
            .then(data => {
                const username = data.username;
                console.log('Username:', username);  // 콘솔에 username 출력

                // username을 화면에 표시
                document.getElementById('usernameText').textContent = username;
                document.getElementById('usernameDisplay').style.display = 'block';
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
    }
</script>
</body>
</html>
