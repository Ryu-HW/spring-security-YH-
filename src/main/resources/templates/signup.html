<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

    <!-- csrf활성화시 html head태그에 추가해야함 없어도 잘 되긴함-->
<!--    <meta name="_csrf" content="{{_csrf.token}}"/>-->
<!--    <meta name="_csrf_header" content="{{_csrf.headerName}}"/>-->
</head>
<body>
회원가입 페이지
<hr>
<form id="signup-form">
    <input id="username" type="email" name="email" placeholder="id"/>
    <input id="password" type="password" name="password" placeholder="password"/>
<!--    <input type="hidden" id="csrf-token" name="_csrf" value="${_csrf.token}"/>-->
    <input type="submit" value="signup"/>
</form>

<script>
    document.getElementById('signup-form').addEventListener('submit', function(event) {
        event.preventDefault();  // 기본 폼 제출 동작을 방지합니다.

        // 입력값을 가져옵니다.
        const email = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        //const csrfToken = document.getElementById('csrf-token').value;

        // JSON 데이터로 변환
        const signupData = {
            email: email,
            password: password,
            //_csrf: csrfToken
        };

        // fetch API를 사용하여 POST 요청 보내기
        fetch('/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(signupData)  // JSON 형태로 데이터를 전송
        })
        .then(response => {
            if (response.ok) {
                return response.json();  // 응답을 JSON으로 변환
            } else {
                throw new Error('회원가입 실패');
            }
        })
        .then(data => {
            console.log('회원가입 성공:', data);
            // 회원가입 성공 후 추가 동작을 여기에서 처리
            window.location.href = "/";  // 예: 홈 페이지로 리다이렉트
        })
        .catch(error => {
            console.error('회원가입 오류:', error);
            // 회원가입 실패 후 처리 (예: 에러 메시지 출력)
            alert("회원가입 실패");
            window.location.href = "/signup";  // 회원가입 실패 시 다시 signup 페이지로 리다이렉트
        });
    });
</script>

</body>
</html>
